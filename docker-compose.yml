services:
  guestlab:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      APP_USER: ${APP_USER:-vioso}
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in Coolify}
      DATA_DIR: /app/data
      PORT: "8080"
    volumes:
      - exaplay_guest_data:/app/data
    restart: unless-stopped
volumes:
  exaplay_guest_data:
